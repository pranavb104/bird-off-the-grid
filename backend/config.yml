# BirdNET Backend Configuration

# Location — set to your coordinates for species filtering
latitude: 0.0
longitude: 0.0

# Minimum confidence to save a detection (0.0 - 1.0)
confidence_threshold: 0.75

# False-positive filter: require N detections within window before saving
min_detection_count: 2
detection_window_seconds: 300

# Species to silently drop during inference (case-insensitive match
# against either common or scientific name). Useful for chronic
# false-positive species at your location.
# Example:
#   exclusions:
#     - "House Sparrow"
#     - "Turdus migratorius"
exclusions: [Spotted Crake]

# Stop saving a species once it has this many rows in birds.db (lifetime).
# Set to 0 to disable. Raising the value or clearing the DB re-enables saving.
max_detections_per_species: 0

# Audio capture settings
audio:
  device: "plughw:1,0"     # USB PnP Sound Device (card 1, device 0)
  sample_rate: 48000
  record_duration: 15       # seconds per recording
  chunk_duration: 3         # seconds per analysis chunk
  chunk_overlap: 0.0        # seconds of overlap between chunks (0.0 - <chunk_duration)

# Sigmoid sensitivity (BirdNET-Analyzer flat_sigmoid). 1.0 = standard sigmoid.
# >1.0 sharpens the curve (more confident, fewer detections),
# <1.0 softens it (more detections, more false positives). Range typically 0.5 - 1.5.
sensitivity: 1.0

# Model paths (relative to project root)
model:
  path: "model/BirdNET_GLOBAL_6K_V2.4_Model_FP32.tflite"
  labels: "model/BirdNET_GLOBAL_6K_V2.4_Labels_en.txt"

# API server
api:
  host: "0.0.0.0"
  port: 7007

# Data directory (relative to project root)
data_dir: "data"

# WittyPi HAT schedule control
wittypi:
  schedules_dir: "/home/pi/wittypi/schedules"
  run_script: "/home/pi/wittypi/runScript.sh"
